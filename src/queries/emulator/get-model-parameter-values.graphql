query model_parameters_for_model($regionId: String!, $inputName: String!, $modelType: String!) {
  execution_parameter_binding(where: {modelcatalog_parameter: {label: {_eq: $inputName}}, execution: {status: {_eq: "SUCCESS"}, modelcatalog_configuration: {label: {_eq: $modelType}, thread_models: {thread: {_or: [{region_id: {_eq: $regionId}}, {region: {parent_region_id: {_eq: $regionId}}}]}}}}}, distinct_on: parameter_value) {
    parameter_value
  }
}
